<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Olymp Pro Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            color: #e0e0e0;
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        /* Картка */
        .card {
            background: rgba(18, 25, 40, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        /* Пара */
        .pair-badge {
            background: #1e2a3a;
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: bold;
            font-size: 18px;
            display: inline-block;
            margin-bottom: 16px;
            border-left: 3px solid #ffd700;
        }
        /* Ціна */
        .price {
            font-size: 32px;
            font-weight: 700;
            margin: 8px 0;
            letter-spacing: 1px;
        }
        .change-up { color: #00c853; }
        .change-down { color: #ff3b30; }
        /* Грід для кнопок */
        .buttons-grid {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 48px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
            text-align: center;
            background: #2a3a50;
            color: white;
        }
        .btn:active { transform: scale(0.97); }
        .btn-buy { background: #00c853; color: white; box-shadow: 0 2px 8px rgba(0,200,83,0.3); }
        .btn-sell { background: #ff3b30; color: white; box-shadow: 0 2px 8px rgba(255,59,48,0.3); }
        .btn-primary { background: #ffd700; color: #0a0f1e; font-weight: bold; }
        .vote-btn {
            background: #1e2a3a;
            border: 1px solid #3a4a60;
            flex: 0.4;
        }
        .vote-btn.voted {
            opacity: 0.5;
            background: #3a4a60;
            text-decoration: line-through;
        }
        /* Шкала якості */
        .quality-bar {
            background: #1e2a3a;
            border-radius: 20px;
            height: 8px;
            margin: 12px 0;
            overflow: hidden;
        }
        .quality-fill {
            width: 0%;
            height: 100%;
            background: #ffd700;
            border-radius: 20px;
            transition: width 0.3s;
        }
        /* AI блок */
        .ai-box {
            background: #0e1622;
            border-radius: 16px;
            padding: 12px;
            margin: 16px 0;
            border-left: 4px solid #ffd700;
        }
        /* Сітка для статистики */
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }
        hr {
            border-color: #2a3a50;
            margin: 16px 0;
        }
        .badge {
            background: #1e2a3a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        footer {
            text-align: center;
            font-size: 12px;
            color: #5a6e8a;
            margin-top: 32px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Головна картка сигналу -->
    <div class="card" id="signalCard">
        <div class="flex-between">
            <span class="pair-badge" id="pairName">EUR/USD</span>
            <span class="badge" id="timeframe">M2</span>
        </div>
        <div class="price" id="price">1.00000</div>
        <div class="flex-between">
            <span id="direction">⚡ Очікування...</span>
            <span id="qualityValue">Якість: --%</span>
        </div>
        <div class="quality-bar">
            <div class="quality-fill" id="qualityFill"></div>
        </div>
        <div id="reasonText" style="font-size: 13px; color: #8a9bc0;">→ Натисніть "Отримати сигнал"</div>

        <!-- Блок ШІ -->
        <div class="ai-box" id="aiBox">
            <strong>🧠 ШІ-РАДНИК</strong>
            <div id="aiText" style="font-size: 12px; margin-top: 8px;">Очікування даних...</div>
        </div>

        <!-- Головні кнопки дій -->
        <div class="buttons-grid">
            <button class="btn btn-primary" id="getSignalBtn">🎯 ОТРИМАТИ СИГНАЛ</button>
        </div>
        <div class="buttons-grid" id="voteButtons" style="display: none;">
            <button class="btn vote-btn" id="winBtn">✅ ПЛЮС +1</button>
            <button class="btn vote-btn" id="lossBtn">❌ МІНУС -1</button>
            <button class="btn" id="newPairBtn">🇺🇦 ІНША ПАРА</button>
        </div>
    </div>

    <!-- Статистика -->
    <div class="card" id="statsCard">
        <div style="font-weight: bold; margin-bottom: 12px;">📊 КАБІНЕТ</div>
        <div class="stats-row"><span>✅ WIN:</span> <span id="statWins">0</span></div>
        <div class="stats-row"><span>❌ LOSS:</span> <span id="statLosses">0</span></div>
        <div class="stats-row"><span>📈 WR:</span> <span id="statWr">0%</span></div>
        <div class="stats-row"><span>🔥 СЕРІЯ:</span> <span id="statStreak">0</span></div>
        <div class="stats-row"><span>💰 ПРИБУТОК:</span> <span id="statProfit">$0</span></div>
        <hr>
        <div style="font-size: 13px;" id="lastTrades">Історія угод порожня</div>
    </div>
    <footer>💙💛 OLYMP PRO AI — Разом до Перемоги!</footer>
</div>

<script>
    // API твого бота (Миша, ЗАМІНИ ЦЕ ПОТІМ!)
    const BOT_API_URL = "https://your-bot-domain.com/api"; 

    let currentPair = "EUR/USD";
    let currentSignalId = null;

    // --- UI Функції ---
    function updateSignalUI(data) {
        document.getElementById('price').innerText = data.price?.toFixed(5) || '---';
        let dirElement = document.getElementById('direction');
        if (data.direction === 'BUY') {
            dirElement.innerHTML = '🟢 КУПУВАТИ ▲';
            dirElement.style.color = '#00c853';
        } else if (data.direction === 'SELL') {
            dirElement.innerHTML = '🔴 ПРОДАВАТИ ▼';
            dirElement.style.color = '#ff3b30';
        } else {
            dirElement.innerHTML = '⚡ Очікування...';
            dirElement.style.color = '#e0e0e0';
        }
        
        let quality = data.quality || 0;
        document.getElementById('qualityValue').innerHTML = `⚡ ЯКІСТЬ: ${quality}%`;
        document.getElementById('qualityFill').style.width = `${quality}%`;
        document.getElementById('reasonText').innerHTML = `📌 ПРИЧИНА: ${data.reason || '—'}`;
        
        // ШІ блок
        let aiHtml = `<strong>🤖 ВИСНОВОК: ${data.ai_verdict || 'НЕЙТРАЛЬНО'}</strong><br>`;
        aiHtml += `✅ Схожість з плюсами: ${data.ai_win_sim || 0}%<br>`;
        aiHtml += `❌ Схожість з мінусами: ${data.ai_loss_sim || 0}%<br>`;
        aiHtml += `<span style="font-size:11px;">${data.ai_conclusion || ''}</span>`;
        document.getElementById('aiText').innerHTML = aiHtml;
        
        if (data.signal_id) {
            currentSignalId = data.signal_id;
            document.getElementById('voteButtons').style.display = 'flex';
        } else {
            document.getElementById('voteButtons').style.display = 'none';
        }
    }

    function updateStatsUI(stats) {
        document.getElementById('statWins').innerText = stats.wins || 0;
        document.getElementById('statLosses').innerText = stats.losses || 0;
        document.getElementById('statWr').innerText = `${stats.wr || 0}%`;
        document.getElementById('statStreak').innerText = stats.streak || 0;
        document.getElementById('statProfit').innerText = `$${stats.total_profit || 0}`;
        if (stats.history && stats.history.length) {
            let html = '';
            stats.history.slice(-5).forEach(t => {
                html += `<div>${t.time} - ${t.type === 'win' ? '✅' : '❌'} ${Math.abs(t.profit)}$</div>`;
            });
            document.getElementById('lastTrades').innerHTML = html;
        }
    }

    // --- Запити до твого бота (через Proxy або Webhook) ---
    async function getSignal() {
        try {
            // ТИМЧАСОВО: емуляція сигналу, поки не підключиш бота
            // (Потім замінити на реальний запит до твого сервера)
            console.log("Запит сигналу для:", currentPair);
            // Емуляція
            let fakeSignal = {
                price: 1.20564,
                direction: "BUY",
                quality: 85,
                reason: "БІЛЯ ПІДТРИМКИ",
                ai_verdict: "ДОБРЕ ✅",
                ai_win_sim: 78,
                ai_loss_sim: 22,
                ai_conclusion: "Схожі умови давали плюс 5 разів",
                signal_id: "test_" + Date.now()
            };
            updateSignalUI(fakeSignal);
            showToast("Сигнал отримано!", "#00c853");
        } catch(e) {
            alert("Помилка: не вдалося отримати сигнал");
        }
    }

    async function sendVote(voteType) {
        if (!currentSignalId) {
            alert("Спочатку отримайте сигнал!");
            return;
        }
        try {
            console.log("Надіслано оцінку:", voteType, currentSignalId);
            showToast(`Оцінку ${voteType} зараховано!`, "#ffd700");
            // Після голосування блокуємо кнопки
            document.getElementById('winBtn').disabled = true;
            document.getElementById('lossBtn').disabled = true;
        } catch(e) {
            alert("Помилка надсилання");
        }
    }

    function showToast(msg, color) {
        let toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = color;
        toast.style.color = '#000';
        toast.style.padding = '10px 20px';
        toast.style.borderRadius = '40px';
        toast.style.fontWeight = 'bold';
        toast.style.zIndex = '9999';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    // --- Ініціалізація та тестові дані ---
    window.onload = () => {
        // Емуляція статистики (тимчасово)
        updateStatsUI({ wins: 0, losses: 0, wr: 0, streak: 0, total_profit: 0, history: [] });
        
        document.getElementById('getSignalBtn').onclick = () => getSignal();
        document.getElementById('winBtn').onclick = () => sendVote('win');
        document.getElementById('lossBtn').onclick = () => sendVote('loss');
        document.getElementById('newPairBtn').onclick = () => {
            // Тут ти можеш викликати меню вибору пари
            alert("Перемикання пари: необхідно налаштувати API бота");
        };
    };
</script>
</body>
</html>
