<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Olymp Pro Terminal</title>
    <script src="https://unpkg.com/lightweight-charts@4.0.0/dist/lightweight-charts.standalone.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            color: #e0e0e0;
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: rgba(18, 25, 40, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .chart-container {
            background: #0e1622;
            border-radius: 16px;
            padding: 12px;
            margin: 16px 0;
            border: 1px solid #2a3a50;
        }
        #candles-chart {
            width: 100%;
            height: 400px;
            border-radius: 12px;
        }
        .pair-badge {
            background: #1e2a3a;
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: bold;
            font-size: 18px;
            display: inline-block;
            margin-bottom: 16px;
            border-left: 3px solid #ffd700;
        }
        .price {
            font-size: 32px;
            font-weight: 700;
            margin: 8px 0;
            letter-spacing: 1px;
        }
        .buttons-grid {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 48px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
            text-align: center;
            background: #2a3a50;
            color: white;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: #ffd700; color: #0a0f1e; font-weight: bold; }
        .vote-btn {
            background: #1e2a3a;
            border: 1px solid #3a4a60;
            flex: 0.4;
        }
        .vote-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .quality-bar {
            background: #1e2a3a;
            border-radius: 20px;
            height: 8px;
            margin: 12px 0;
            overflow: hidden;
        }
        .quality-fill {
            width: 0%;
            height: 100%;
            background: #ffd700;
            border-radius: 20px;
            transition: width 0.3s;
        }
        .ai-box {
            background: #0e1622;
            border-radius: 16px;
            padding: 12px;
            margin: 16px 0;
            border-left: 4px solid #ffd700;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }
        hr {
            border-color: #2a3a50;
            margin: 16px 0;
        }
        .badge {
            background: #1e2a3a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        footer {
            text-align: center;
            font-size: 12px;
            color: #5a6e8a;
            margin-top: 32px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="flex-between">
            <span class="pair-badge" id="pairName">EUR/USD</span>
            <span class="badge" id="timeframe">M2</span>
        </div>
        <div class="chart-container">
            <div id="candles-chart"></div>
        </div>
        <div class="price" id="price">1.00000</div>
        <div class="quality-bar">
            <div class="quality-fill" id="qualityFill"></div>
        </div>
        <div id="reasonText" style="font-size: 13px; color: #8a9bc0;">📌 Причина: —</div>
        
        <div class="ai-box" id="aiBox">
            <strong>🧠 ШІ-РАДНИК</strong>
            <div id="aiText" style="font-size: 12px; margin-top: 8px;">Очікування даних...</div>
        </div>

        <div class="buttons-grid">
            <button class="btn btn-primary" id="getSignalBtn">🎯 ОТРИМАТИ СИГНАЛ</button>
        </div>
        <div class="buttons-grid" id="voteButtons" style="display: none;">
            <button class="btn vote-btn" id="winBtn">✅ ПЛЮС +1</button>
            <button class="btn vote-btn" id="lossBtn">❌ МІНУС -1</button>
            <button class="btn" id="newPairBtn">🇺🇦 ІНША ПАРА</button>
        </div>
    </div>

    <div class="card" id="statsCard">
        <div style="font-weight: bold; margin-bottom: 12px;">📊 КАБІНЕТ</div>
        <div class="stats-row"><span>✅ WIN:</span> <span id="statWins">0</span></div>
        <div class="stats-row"><span>❌ LOSS:</span> <span id="statLosses">0</span></div>
        <div class="stats-row"><span>📈 WR:</span> <span id="statWr">0%</span></div>
        <div class="stats-row"><span>🔥 СЕРІЯ:</span> <span id="statStreak">0</span></div>
        <div class="stats-row"><span>💰 ПРИБУТОК:</span> <span id="statProfit">$0</span></div>
        <hr>
        <div style="font-size: 13px;" id="lastTrades">Історія угод порожня</div>
    </div>
    <footer>💙💛 OLYMP PRO AI — Разом до Перемоги! 🇺🇦</footer>
</div>

<script>
    // ===== ПІДКЛЮЧЕННЯ ДО ТВОГО БОТА =====
    // ЯКЩО ХОЧЕШ РЕАЛЬНІ ДАНІ, ЗАМІНИ ЦЕ ПОСИЛАННЯ НА АДРЕСУ ТВОГО БОТА
    // const BOT_API_URL = "http://localhost:8000";
    const BOT_API_URL = "https://your-bot-domain.com/api";  // ТИМЧАСОВО ДЕМО
    
    let currentPair = "EURUSD_otc";
    let currentSignalId = null;
    let chart, candlestickSeries;

    function initChart() {
        chart = LightweightCharts.createChart(document.getElementById('candles-chart'), {
            layout: { background: { color: '#0e1622' }, textColor: '#e0e0e0' },
            grid: { vertLines: { color: '#1e2a3a' }, horzLines: { color: '#1e2a3a' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#2a3a50' },
            timeScale: { borderColor: '#2a3a50', timeVisible: true, secondsVisible: false },
        });
        candlestickSeries = chart.addCandlestickSeries({
            upColor: '#00c853', downColor: '#ff3b30', borderDownColor: '#ff3b30',
            borderUpColor: '#00c853', wickUpColor: '#00c853', wickDownColor: '#ff3b30',
        });
        chart.timeScale().fitContent();
    }

    function updateSignalUI(data) {
        document.getElementById('price').innerHTML = data.price?.toFixed(5) || '---';
        document.getElementById('qualityFill').style.width = `${data.quality || 0}%`;
        document.getElementById('reasonText').innerHTML = `📌 ПРИЧИНА: ${data.reason || '—'}`;
        let aiHtml = `<strong>🤖 ВИСНОВОК: ${data.ai_verdict || 'НЕЙТРАЛЬНО'}</strong><br>`;
        aiHtml += `✅ Схожість з плюсами: ${data.ai_win_sim || 0}%<br>`;
        aiHtml += `❌ Схожість з мінусами: ${data.ai_loss_sim || 0}%<br>`;
        aiHtml += `<span style="font-size:11px;">${data.ai_conclusion || ''}</span>`;
        document.getElementById('aiText').innerHTML = aiHtml;
        if (data.signal_id && data.signal_id !== "demo") {
            currentSignalId = data.signal_id;
            document.getElementById('voteButtons').style.display = 'flex';
        } else {
            document.getElementById('voteButtons').style.display = 'none';
        }
        if (data.candles && data.candles.length) {
            candlestickSeries.setData(data.candles);
            chart.timeScale().fitContent();
        }
    }

    function updateStatsUI(stats) {
        document.getElementById('statWins').innerText = stats.wins || 0;
        document.getElementById('statLosses').innerText = stats.losses || 0;
        document.getElementById('statWr').innerText = `${stats.wr || 0}%`;
        document.getElementById('statStreak').innerText = stats.streak || 0;
        document.getElementById('statProfit').innerText = `$${stats.total_profit || 0}`;
        if (stats.history && stats.history.length) {
            let html = '';
            stats.history.slice(-5).forEach(t => {
                html += `<div>${t.time} - ${t.type === 'win' ? '✅' : '❌'} ${Math.abs(t.profit)}$</div>`;
            });
            document.getElementById('lastTrades').innerHTML = html;
        }
    }

    function showToast(msg, color) {
        let toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = color;
        toast.style.color = '#000';
        toast.style.padding = '10px 20px';
        toast.style.borderRadius = '40px';
        toast.style.fontWeight = 'bold';
        toast.style.zIndex = '9999';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    async function getSignal() {
        try {
            const res = await fetch(`${BOT_API_URL}/api/signal?pair=${currentPair}`);
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            updateSignalUI(data);
            showToast("Сигнал отримано! Графік оновлено.", "#00c853");
        } catch(e) {
            console.warn("Не вдалося підключитися до бота, показую демо-дані");
            // Демо-дані для красивої картинки
            const demoData = {
                price: 1.20564,
                quality: 85,
                reason: "БІЛЯ ПІДТРИМКИ (демо)",
                ai_verdict: "ДОБРЕ ✅",
                ai_win_sim: 78,
                ai_loss_sim: 22,
                ai_conclusion: "Схожі умови давали плюс 5 разів (демо)",
                signal_id: "demo",
                candles: [
                    { time: '2026-05-03', open: 1.1905, high: 1.1915, low: 1.1900, close: 1.1910 },
                    { time: '2026-05-04', open: 1.1910, high: 1.1920, low: 1.1905, close: 1.1918 },
                    { time: '2026-05-05', open: 1.1918, high: 1.1930, low: 1.1910, close: 1.1925 },
                ]
            };
            updateSignalUI(demoData);
            showToast("Демо-режим: бот не підключено", "#ffa500");
        }
    }

    async function sendVote(voteType) {
        if (!currentSignalId || currentSignalId === "demo") {
            alert("У демо-режимі голосування недоступне. Підключіть бота.");
            return;
        }
        try {
            console.log("Надіслано оцінку:", voteType, currentSignalId);
            showToast(`Оцінку ${voteType} зараховано!`, "#ffd700");
            document.getElementById('winBtn').disabled = true;
            document.getElementById('lossBtn').disabled = true;
        } catch(e) {
            alert("Помилка надсилання");
        }
    }

    window.onload = async () => {
        initChart();
        try {
            const res = await fetch(`${BOT_API_URL}/api/stats`);
            const stats = await res.json();
            updateStatsUI(stats);
        } catch(e) {
            console.log("Не вдалося завантажити статистику, демо-дані");
            updateStatsUI({ wins: 5, losses: 3, wr: 62.5, streak: 2, total_profit: 12, history: [
                { time: "14:30", type: "win", profit: 5 },
                { time: "14:25", type: "loss", profit: -5 },
                { time: "14:20", type: "win", profit: 5 },
            ]});
        }
        document.getElementById('getSignalBtn').onclick = () => getSignal();
        document.getElementById('winBtn').onclick = () => sendVote('win');
        document.getElementById('lossBtn').onclick = () => sendVote('loss');
        document.getElementById('newPairBtn').onclick = () => alert("Вибір пари: необхідно налаштувати API бота");
    };
</script>
</body>
</html>
